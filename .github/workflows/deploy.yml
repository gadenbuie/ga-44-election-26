# Build the static site and publish it to GitHub Pages.
#
# Requires the repo setting "Pages → Source = GitHub Actions" (the
# actions/deploy-pages job asks for it on first run). The site then lives at
# https://<user>.github.io/<repo>/; PAGES_BASE carries that path into the
# build so SvelteKit emits correct absolute URLs.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # No trailing slash: SvelteKit requires paths.base to be '/repo-name', not '/repo-name/'
  PAGES_BASE: /${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
